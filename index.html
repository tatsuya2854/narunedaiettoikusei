<style>
/* ============================================================
   デザイントークン
   ============================================================ */
:root{
  --sugar:#FFF3F6;      /* ベース（ミルクピンク） */
  --peach:#FF5E86;      /* メイン（なるねぇピンク） */
  --peach-d:#E23C6A;    /* 押し込み影 */
  --berry:#4A2233;      /* 文字（黒は使わない） */
  --mint:#2FBFA0;       /* 運動・成功 */
  --mint-d:#1E9C81;
  --butter:#FFC24B;     /* スタンプ・連続日数 */
  --sky:#6BB7FF;        /* きれい */
  --wall:#FBD9E4;       /* 部屋の壁 */
  --floor:#F2B9CB;      /* 床 */
  --line:rgba(74,34,51,.12);

  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --font-disp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",system-ui,sans-serif;
  --font-body:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"M PLUS Rounded 1c",ui-rounded,system-ui,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-body);
  color:var(--berry);
  background:#F6E7EC;
  display:flex;align-items:center;justify-content:center;
  overscroll-behavior:none;
}

/* ============================================================
   本体（390 x 750 のスマホ枠。実機では画面いっぱい）
   ============================================================ */
#app{
  position:relative;
  width:390px;height:750px;
  max-width:100vw;max-height:100dvh;
  background:var(--sugar);
  border-radius:28px;overflow:hidden;
  box-shadow:0 24px 60px rgba(74,34,51,.22);
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
}
@media (max-width:430px){
  #app{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  body{background:var(--sugar)}
}

/* ---------- 上部ステータス ---------- */
.hud{
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,#fff 0%,#FFF3F6 100%);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--font-disp);font-weight:800;font-size:15px;letter-spacing:.02em;line-height:1.15}
.brand small{
  display:inline-flex;align-items:center;gap:5px;margin-top:3px;
  font-size:10px;font-weight:800;color:#fff;letter-spacing:.04em;
  background:var(--peach);border-radius:999px;padding:2px 8px 2px 6px;
}
.brand small .lv{background:#fff;color:var(--peach);border-radius:999px;padding:0 5px;font-size:9px}
.brand small.stage4{background:linear-gradient(90deg,#FF5E86,#FFB13B)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.streak{
  display:flex;align-items:center;gap:4px;
  background:#FFF3DF;border:1.5px solid var(--butter);
  border-radius:999px;padding:3px 10px;
  font-family:var(--font-num);font-weight:800;font-size:12px;color:#A9700B;white-space:nowrap;
}
.streak span.n{font-size:15px}
.age{font-size:9.5px;font-weight:700;opacity:.6;letter-spacing:.06em;white-space:nowrap}

.gauges{display:flex;gap:6px;margin-top:8px}
.gauge{flex:1;background:#fff;border-radius:var(--r-sm);padding:5px 7px;border:1px solid var(--line);min-width:0}
.gauge .lb{font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.62;display:flex;justify-content:space-between;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:#F1DCE3;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.34,1.4,.5,1)}
#barPuni i{background:linear-gradient(90deg,#FFA8C3,var(--peach))}
#barMood i{background:linear-gradient(90deg,#FFD98A,var(--butter))}
#barEnergy i{background:linear-gradient(90deg,#8FE3CF,var(--mint))}
#barBeauty i{background:linear-gradient(90deg,#B7DCFF,var(--sky))}

.weight-row{
  margin-top:7px;display:flex;align-items:baseline;gap:8px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:6px 12px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.weight-row .k{font-size:10px;font-weight:700;opacity:.6;letter-spacing:.08em}
.weight-row .v{font-family:var(--font-num);font-weight:800;font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.weight-row .u{font-size:11px;font-weight:700;opacity:.6;margin-left:-4px}
.weight-row .d{margin-left:auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.d.down{color:var(--mint)} .d.up{color:var(--peach)} .d.flat{opacity:.45}

/* ---------- 中央ステージ（部屋） ---------- */
.stage{
  position:relative;flex:1 1 auto;min-height:0;
  background:
    radial-gradient(120% 80% at 50% 0%, #FFF0F5 0%, var(--wall) 62%, #F6C9D9 100%);
  overflow:hidden;
  transition:filter .8s ease;
}
.stage::after{ /* 床 */
  content:"";position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,var(--floor),#E9A6BE);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
}
/* 散らかると部屋がくすむ */
.stage[data-mess="3"]{filter:saturate(.9) brightness(.97)}
.stage[data-mess="4"]{filter:saturate(.8) brightness(.94) sepia(.08)}
.stage[data-mess="5"]{filter:saturate(.7) brightness(.9) sepia(.16)}

/* 窓・棚・クローゼット（小道具） */
.window{
  position:absolute;bottom:47%;left:10px;width:58px;height:62px;border-radius:11px;
  background:linear-gradient(180deg,#CFEFFF,#EAF9FF);
  border:5px solid #fff;box-shadow:0 4px 0 rgba(74,34,51,.07);
  transition:background 1s ease;
}
.window::before,.window::after{content:"";position:absolute;background:#fff}
.window::before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-2px)}
.window::after{top:50%;left:0;right:0;height:4px;transform:translateY(-2px)}
.stage.night .window{background:linear-gradient(180deg,#2B2F6B,#4A4F9E)}
.shelf{position:absolute;bottom:29%;right:8px;width:76px;text-align:center;z-index:1}
.shelf .plank{height:7px;background:#E7A98A;border-radius:4px;box-shadow:0 3px 0 rgba(74,34,51,.08)}
.shelf .jar{
  display:block;width:34px;height:auto;margin:0 auto 2px;cursor:pointer;
  filter:drop-shadow(0 3px 4px rgba(74,34,51,.22));
  transition:transform .15s ease;
}
.shelf .jar:active{transform:scale(.92)}
.shelf .cap{font-size:8px;font-weight:800;letter-spacing:.06em;color:#B25378;display:block;margin-top:3px}

.closet{
  position:absolute;bottom:20%;left:12px;width:54px;height:74px;z-index:1;
  cursor:pointer;border:0;background:none;padding:0;
  filter:drop-shadow(0 4px 3px rgba(74,34,51,.18));
  transition:transform .15s ease;
}
.closet:active{transform:scale(.94)}
.closet svg{width:100%;height:100%;display:block}
.closet .cap{
  position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
  font-size:8px;font-weight:800;letter-spacing:.05em;color:#B25378;white-space:nowrap;
}
.closet .new{
  position:absolute;top:-6px;right:-8px;background:var(--peach);color:#fff;
  font-size:8px;font-weight:800;border-radius:999px;padding:2px 5px;display:none;
  animation:bounce 1s ease-in-out infinite;
}
.closet .new.on{display:block}
@keyframes bounce{50%{transform:translateY(-3px)}}

/* 散らかりもの（うんちの代わり） */
.mess{
  position:absolute;z-index:3;width:46px;height:46px;border:0;background:none;padding:0;
  font-size:30px;line-height:46px;text-align:center;cursor:pointer;
  filter:drop-shadow(0 3px 2px rgba(74,34,51,.25));
  transform:rotate(var(--rot,0deg));
  animation:messin .5s cubic-bezier(.2,1.6,.4,1) both;
  touch-action:manipulation;
}
.mess::after{ /* もわもわ臭 */
  content:"〜";position:absolute;left:50%;top:-14px;transform:translateX(-50%);
  font-size:14px;font-weight:800;color:#8C7A50;opacity:0;
  animation:stink 1.6s ease-in-out infinite;
}
.stage[data-mess="3"] .mess::after,.stage[data-mess="4"] .mess::after,.stage[data-mess="5"] .mess::after{opacity:.75}
@keyframes stink{0%,100%{transform:translate(-50%,0) rotate(0)}50%{transform:translate(-50%,-6px) rotate(12deg)}}
@keyframes messin{from{transform:translateY(-40px) rotate(var(--rot,0deg)) scale(.4);opacity:0}}
.mess:active{transform:scale(.85) rotate(var(--rot,0deg))}
.mess.gone{animation:messout .4s ease forwards;pointer-events:none}
@keyframes messout{to{transform:scale(0) rotate(180deg);opacity:0}}
.mess-hint{
  position:absolute;right:10px;top:116px;z-index:4;
  background:rgba(255,255,255,.92);border:1.5px solid var(--berry);border-radius:999px;
  padding:4px 10px;font-family:var(--font-disp);font-weight:800;font-size:10.5px;
  display:none;animation:pop .3s ease;
}
.mess-hint.on{display:block}

/* 吹き出し */
.bubble{
  position:absolute;left:14px;right:14px;top:12px;z-index:5;
  background:#fff;border:2.5px solid var(--berry);
  border-radius:18px;padding:11px 14px;
  font-family:var(--font-disp);font-weight:700;font-size:14px;line-height:1.55;
  min-height:62px;white-space:pre-line;
  box-shadow:0 5px 0 rgba(74,34,51,.13);
  animation:pop .32s cubic-bezier(.2,1.6,.4,1);
  transition:opacity .4s ease;
}
.stage.disco .bubble{opacity:0;pointer-events:none}
.bubble::after{
  content:"";position:absolute;bottom:-14px;left:38px;
  border:12px solid transparent;border-top-color:var(--berry);border-bottom:0;
}
.bubble .cursor{display:inline-block;width:.55em;height:1em;vertical-align:-2px;background:var(--peach);border-radius:2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{transform:scale(.9) translateY(6px);opacity:0}}

/* ---------- アバター ---------- */
.avatar-wrap{
  position:absolute;left:50%;bottom:13%;z-index:2;
  transform:translateX(-50%);
  width:238px;height:246px;
  display:flex;align-items:flex-end;justify-content:center;
}
.shadow{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:104px;height:16px;border-radius:50%;background:rgba(74,34,51,.16);filter:blur(2px);
  animation:sh 2.4s ease-in-out infinite;
}
/* ふわふわ（周期3.7s）と ぷにぷに（周期1.55s）を別レイヤーで回す。
   周期をわざとズラすと、ループの繰り返しが目に見えなくなる */
.av-float{
  width:100%;height:100%;
  display:flex;align-items:flex-end;justify-content:center;
  transform-origin:50% 92%;
  animation:float 3.7s cubic-bezier(.45,.05,.55,.95) infinite;
  will-change:transform;
}
@keyframes float{
  0%  {transform:translateY(0)     rotate(0deg)}
  22% {transform:translateY(-7px)  rotate(1.2deg)}
  47% {transform:translateY(-10px) rotate(0deg)}
  72% {transform:translateY(-4px)  rotate(-1.2deg)}
  100%{transform:translateY(0)     rotate(0deg)}
}
/* 成長段階（大きさ）と体型（ぷに度）は、このレイヤーの拡大率で表す。
   --gx / --gy は JS が状態から計算して入れる */
.av-grow{
  position:relative;height:100%;width:auto;aspect-ratio:324/355;
  transform:scale(var(--gx,1),var(--gy,1));
  transform-origin:50% 100%;
  transition:transform 1.1s cubic-bezier(.34,1.3,.5,1);
}
/* 12ポーズを1枚にまとめたスプライトシート（3Dレンダーを2Dに焼いたもの）。
   背景の表示位置を切り替える＝パラパラ漫画。画像は1リクエストで済む */
.body{
  position:relative;width:100%;height:100%;
  transform-origin:50% 100%;
  animation:squash 1.6s cubic-bezier(.37,0,.63,1) infinite;
  transition:filter .9s ease;will-change:transform;
}
.sprite{
  position:absolute;inset:0;
  background-size:400% 300%;
  background-repeat:no-repeat;
  background-position:33.333% 0%;
}
@keyframes squash{
  0%,100%{transform:scale(1,1)}
  34%    {transform:scale(.968,1.036)}
  68%    {transform:scale(1.034,.97)}
}
@keyframes sh{0%,100%{transform:translateX(-50%) scale(1);opacity:.16}
              47%{transform:translateX(-50%) scale(.78);opacity:.08}}

/* きれい度で見た目が変わる */
.avatar-wrap[data-beauty="high"] .body{filter:saturate(1.12) brightness(1.04) drop-shadow(0 0 6px rgba(255,236,150,.8))}
.avatar-wrap[data-beauty="low"]  .body{filter:saturate(.68) brightness(.93) contrast(.96)}
.aura{
  position:absolute;left:50%;top:52%;width:120%;aspect-ratio:1;z-index:-1;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,240,160,.7) 0%,rgba(255,220,120,.25) 40%,rgba(255,220,120,0) 66%);
  opacity:0;transition:opacity .9s ease;
  animation:aura 2.6s ease-in-out infinite;
}
.avatar-wrap[data-beauty="high"] .aura{opacity:1}
@keyframes aura{50%{transform:translate(-50%,-50%) scale(1.08)}}
.stinkLines{
  position:absolute;right:6%;top:6%;width:22%;pointer-events:none;
  opacity:0;transition:opacity .6s ease;
}
.avatar-wrap[data-beauty="low"] .stinkLines{opacity:.8;animation:stinkL 1.8s ease-in-out infinite}
@keyframes stinkL{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(6deg)}}
/* 太ると汗、痩せすぎるとふらふら */
.avatar-wrap[data-shape="chubby"] .body::after{
  content:"💦";position:absolute;right:14%;top:22%;font-size:20px;animation:sweat 1.4s ease-in-out infinite;
}
@keyframes sweat{0%,100%{opacity:0;transform:translateY(-4px)}40%{opacity:1}80%{opacity:0;transform:translateY(10px)}}
.avatar-wrap[data-shape="toomuch"] .av-float{animation-duration:1.6s}

/* アクセサリー（ポーズごとの頭の位置に追従） */
.acc{
  position:absolute;pointer-events:none;
  left:var(--hx,48%);top:var(--hy,16%);
  width:var(--aw,28%);
  transform:translate(calc(-50% + var(--ax,0%)),calc(-50% + var(--ay,0%)));
  filter:drop-shadow(0 2px 1px rgba(74,34,51,.18));
  transition:left .12s ease,top .12s ease;
}
.acc svg{width:100%;height:auto;display:block}
.acc:empty{display:none}

/* たまご */
.egg{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:150px;height:182px;cursor:pointer;z-index:3;
  transform-origin:50% 95%;
  animation:eggidle 3s ease-in-out infinite;
  display:none;
}
.egg.on{display:block}
.egg svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 6px rgba(74,34,51,.2))}
.egg.wob{animation:eggwob .5s ease}
@keyframes eggidle{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(2deg) translateY(-3px)}}
@keyframes eggwob{0%,100%{transform:translateX(-50%) rotate(0)}20%{transform:translateX(-50%) rotate(-14deg)}45%{transform:translateX(-50%) rotate(12deg)}70%{transform:translateX(-50%) rotate(-7deg)}}
.egg .crack{opacity:0;transition:opacity .2s}
.egg[data-crack="1"] .c1,.egg[data-crack="2"] .c1,.egg[data-crack="2"] .c2,.egg[data-crack="3"] .c1,.egg[data-crack="3"] .c2,.egg[data-crack="3"] .c3{opacity:1}
.egg.hatch{animation:hatch .7s ease forwards}
@keyframes hatch{40%{transform:translateX(-50%) scale(1.15,.85)}100%{transform:translateX(-50%) scale(1.6);opacity:0}}
.avatar-wrap.egg-mode .av-float,.avatar-wrap.egg-mode .shadow{display:none}
.shell{position:absolute;z-index:6;font-size:26px;pointer-events:none;animation:shell .9s ease-out forwards}
@keyframes shell{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}

/* 体の動き（コマ送りと合わせて控えめに乗せる） */
.av-float.act-dance{animation:a-dance 2.05s linear 1}
.av-float.act-jump {animation:a-jump .88s cubic-bezier(.3,.8,.4,1) 1}
.av-float.act-run  {animation:a-run .72s linear 2}
.av-float.act-cheer{animation:a-cheer 1.4s ease-in-out 1}
.av-float.act-win  {animation:a-win 1.44s cubic-bezier(.34,1.2,.5,1) 1}
.av-float.act-tilt {animation:a-tilt 1.05s ease-in-out 1}
.av-float.act-shy  {animation:a-shy 1.7s ease-in-out 1}
.av-float.act-kiss {animation:a-kiss 1.4s ease-in-out 1}
.av-float.dancing  {animation:a-dance var(--beat2,1.07s) linear infinite}

@keyframes a-dance{
  0%{transform:translate(0,0) rotate(0)}      12%{transform:translate(-11px,-5px) rotate(-4deg)}
  25%{transform:translate(0,3px) rotate(0)}   37%{transform:translate(11px,-5px) rotate(4deg)}
  50%{transform:translate(0,3px) rotate(0)}   62%{transform:translate(-11px,-5px) rotate(-4deg)}
  75%{transform:translate(0,3px) rotate(0)}   87%{transform:translate(11px,-5px) rotate(4deg)}
  100%{transform:translate(0,0) rotate(0)}
}
@keyframes a-jump{
  0%{transform:translateY(0) scale(1,1)}      14%{transform:translateY(6px) scale(1.1,.89)}
  42%{transform:translateY(-56px) scale(.92,1.1)} 60%{transform:translateY(-60px)}
  84%{transform:translateY(4px) scale(1.12,.87)}  100%{transform:translateY(0) scale(1,1)}
}
@keyframes a-run{
  0%,100%{transform:translate(0,0) rotate(-3deg)}
  25%{transform:translate(-6px,-9px) rotate(-5deg)}
  75%{transform:translate(6px,-3px) rotate(-1deg)}
}
@keyframes a-cheer{
  0%,100%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(-14px) rotate(3deg)} 50%{transform:translateY(0) rotate(0)}
  70%{transform:translateY(-14px) rotate(-3deg)}
}
@keyframes a-win{
  0%{transform:translateY(0) scale(1,1)} 18%{transform:translateY(8px) scale(1.12,.88)}
  50%{transform:translateY(-64px) scale(.9,1.12) rotate(6deg)}
  82%{transform:translateY(5px) scale(1.12,.88)} 100%{transform:translateY(0) scale(1,1)}
}
@keyframes a-tilt{0%,100%{transform:rotate(0)}45%{transform:rotate(-8deg) translateY(-3px)}}
@keyframes a-shy{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(7px) scale(.95,.95)}}
@keyframes a-kiss{0%,100%{transform:scale(1,1)}35%{transform:scale(1.07,1.07) translateY(-6px)}}

/* 変身フラッシュ・進化 */
.flash{
  position:absolute;inset:0;z-index:8;display:none;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,#fff,rgba(255,255,255,0) 62%);
  animation:flash .9s ease forwards;
}
.flash.on{display:block}
.flash.long{animation-duration:1.8s}
@keyframes flash{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
.shape-tag{
  position:absolute;z-index:9;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);
  background:var(--berry);color:#fff;padding:8px 16px;border-radius:999px;
  font-family:var(--font-disp);font-weight:800;font-size:15px;letter-spacing:.06em;
  opacity:0;pointer-events:none;white-space:nowrap;
}
.shape-tag.on{animation:tag 1.5s ease forwards}
.shape-tag.evo{background:linear-gradient(90deg,#FF5E86,#FFB13B);font-size:18px;padding:10px 22px;box-shadow:0 6px 18px rgba(255,94,134,.45)}
.shape-tag.evo.on{animation:tag 2.6s ease forwards}
@keyframes tag{15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.evo-rays{
  position:absolute;inset:-40%;z-index:7;pointer-events:none;display:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,220,120,.55) 0 8deg,rgba(255,220,120,0) 8deg 20deg);
  animation:rays 2.4s linear forwards;
}
.evo-rays.on{display:block}
@keyframes rays{0%{opacity:0;transform:rotate(0)}20%{opacity:1}100%{opacity:0;transform:rotate(40deg)}}

/* ふわっと上がるエフェクト文字 */
.spark{position:absolute;z-index:6;pointer-events:none;font-size:14px;animation:spark 1s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.25) translate(var(--dx),var(--dy)) rotate(35deg)}}
.fx{position:absolute;z-index:6;font-family:var(--font-disp);font-weight:800;font-size:17px;pointer-events:none;animation:fx 1.1s ease-out forwards;white-space:nowrap}
@keyframes fx{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-58px) scale(1.1)}}

/* ---------- ダンス（リズムゲーム） ---------- */
.stage.disco{background:radial-gradient(120% 80% at 50% 0%,#3B1D4D 0%,#5B2A6E 62%,#3A1848 100%)}
.stage.disco::after{background:linear-gradient(180deg,#6B3A7A,#3A1848);box-shadow:inset 0 2px 0 rgba(255,255,255,.15)}
.disco-lights{
  position:absolute;inset:0;z-index:1;pointer-events:none;display:none;mix-blend-mode:screen;
  background:
    radial-gradient(28% 40% at 20% 20%,rgba(255,94,134,.8),transparent 70%),
    radial-gradient(28% 40% at 80% 25%,rgba(47,191,160,.8),transparent 70%),
    radial-gradient(30% 40% at 50% 70%,rgba(255,194,75,.7),transparent 70%);
  animation:lights var(--beat2,1.07s) ease-in-out infinite;
}
.stage.disco .disco-lights{display:block}
@keyframes lights{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08) rotate(3deg)}}
.dance{
  position:absolute;inset:0;z-index:10;display:none;touch-action:manipulation;
}
.dance.on{display:block}
.dance-hud{
  position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;
  color:#fff;font-family:var(--font-disp);font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25);
}
.dance-hud .sc{font-size:22px;line-height:1}
.dance-hud .sc small{font-size:10px;letter-spacing:.1em;display:block;opacity:.8;margin-bottom:2px}
.dance-hud .cb{font-size:15px;text-align:right}
.dance-hud .cb b{font-size:26px;display:block;color:var(--butter);line-height:1}
.dance-hud .cb.hot b{animation:combo .25s ease}
@keyframes combo{50%{transform:scale(1.35)}}
.dance-prog{position:absolute;left:12px;right:12px;top:62px;height:5px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.dance-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--peach),var(--butter));border-radius:99px}
.dance-mute{
  position:absolute;right:12px;top:78px;background:rgba(255,255,255,.2);border:0;color:#fff;
  border-radius:999px;padding:5px 10px;font:inherit;font-weight:800;font-size:12px;cursor:pointer;
}
.lane{
  position:absolute;left:0;right:0;bottom:0;height:88px;
  background:linear-gradient(180deg,rgba(20,8,30,.55),rgba(20,8,30,.85));
  border-top:2px solid rgba(255,255,255,.25);
}
.lane .line{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.18)}
.ring{
  position:absolute;left:var(--ringx,22%);top:50%;width:58px;height:58px;
  transform:translate(-50%,-50%);border-radius:50%;
  border:4px solid #fff;box-shadow:0 0 0 4px rgba(255,255,255,.15),0 0 18px rgba(255,255,255,.35);
}
.ring.hit{animation:ringhit .25s ease}
@keyframes ringhit{40%{transform:translate(-50%,-50%) scale(1.25);border-color:var(--butter)}}
.note{
  position:absolute;left:0;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;font-weight:800;font-family:var(--font-disp);
  background:var(--peach);box-shadow:0 4px 0 var(--peach-d),0 0 14px rgba(255,94,134,.5);
  will-change:transform;
}
.note.b{background:var(--mint);box-shadow:0 4px 0 var(--mint-d),0 0 14px rgba(47,191,160,.5)}
.note.hit{animation:notehit .3s ease forwards}
.note.miss{animation:notemiss .35s ease forwards}
@keyframes notehit{to{transform:translateX(var(--x)) scale(1.9);opacity:0}}
@keyframes notemiss{to{transform:translateX(var(--x)) translateY(30px);opacity:0}}
.judge{
  position:absolute;left:var(--ringx,22%);bottom:100px;transform:translateX(-50%);
  font-family:var(--font-disp);font-weight:800;font-size:22px;color:#fff;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;animation:judge .55s ease-out forwards;
}
.judge.perfect{color:var(--butter)} .judge.good{color:#8FE3CF} .judge.miss{color:#B9A7C4;font-size:16px}
@keyframes judge{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-26px) scale(1)}}
.count{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:var(--font-disp);font-weight:800;font-size:72px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25);
  pointer-events:none;animation:count .9s ease-out forwards;
}
@keyframes count{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
.tap-hint{
  position:absolute;left:50%;bottom:100px;transform:translateX(-50%);color:#fff;
  font-family:var(--font-disp);font-weight:800;font-size:13px;opacity:.85;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.3);animation:hint 1.2s ease-in-out infinite;
}
@keyframes hint{50%{transform:translate(-50%,-4px)}}

/* ---------- 下部アクション ---------- */
.actions{
  flex:0 0 auto;padding:9px 10px calc(11px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
}
.btn{
  appearance:none;border:0;cursor:pointer;font:inherit;
  background:var(--peach);color:#fff;border-radius:var(--r-md);
  padding:10px 2px 9px;box-shadow:0 4px 0 var(--peach-d);
  font-family:var(--font-disp);font-weight:800;font-size:11.5px;line-height:1.2;
  transition:transform .07s ease,box-shadow .07s ease;width:100%;
}
.btn .ico{display:block;font-size:20px;margin-bottom:3px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--peach-d)}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 var(--mint-d)}
.btn.grape{background:#8C5BD9;box-shadow:0 4px 0 #6A3FB3}
.btn.ghost{background:#fff;color:var(--berry);border:2px solid var(--line);box-shadow:0 4px 0 #EFDDE4}
.btn:focus-visible{outline:3px solid #6BB7FF;outline-offset:2px}
.btn[disabled]{filter:grayscale(.55);opacity:.55;box-shadow:none;transform:translateY(4px);pointer-events:none}
.badge{
  position:absolute;top:-6px;right:-3px;background:var(--butter);color:#5A3A00;
  font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;
}
.btn-wrap{position:relative}

/* ---------- モーダル ---------- */
.sheet{
  position:absolute;inset:0;z-index:20;display:none;
  background:rgba(74,34,51,.42);backdrop-filter:blur(2px);
  align-items:flex-end;
}
.sheet.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet-inner{
  width:100%;max-height:88%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .28s cubic-bezier(.2,1.2,.4,1);
}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin:0 0 3px;font-family:var(--font-disp);font-weight:800;font-size:17px}
.sheet h4{margin:14px 0 8px;font-family:var(--font-disp);font-weight:800;font-size:12px;letter-spacing:.08em;opacity:.7}
.sheet p.sub{margin:0 0 13px;font-size:11.5px;opacity:.65;line-height:1.5}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:#FFF7FA;border:2px solid #FCE0E9;border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer;
  transition:transform .08s ease,border-color .12s ease;
}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:3px solid #6BB7FF;outline-offset:1px}
.opt .e{font-size:25px;flex:0 0 auto}
.opt .t{font-family:var(--font-disp);font-weight:800;font-size:14px}
.opt .s{font-size:10.5px;opacity:.62;margin-top:2px;line-height:1.45}
.sheet .close{
  width:100%;background:none;border:0;font:inherit;font-weight:700;font-size:12.5px;
  color:var(--berry);opacity:.55;padding:9px;cursor:pointer;
}
.wt-input{
  width:100%;font-family:var(--font-num);font-weight:800;font-size:30px;text-align:center;
  border:2px solid #FCE0E9;border-radius:var(--r-md);padding:12px;margin-bottom:11px;color:var(--berry);
}
.wt-input:focus{outline:none;border-color:var(--peach)}
.primary{
  width:100%;background:var(--peach);color:#fff;border:0;border-radius:var(--r-md);
  padding:13px;font-family:var(--font-disp);font-weight:800;font-size:15px;
  box-shadow:0 4px 0 var(--peach-d);cursor:pointer;
}
.primary:active{transform:translateY(4px);box-shadow:none}
.primary.grape{background:#8C5BD9;box-shadow:0 4px 0 #6A3FB3}
.ad-hero{
  border-radius:var(--r-md);padding:16px;margin-bottom:12px;text-align:center;
  background:linear-gradient(160deg,#FFE3EE,#FFC8DC);
}
.ad-hero .jar-lg{
  display:block;width:64px;height:auto;margin:0 auto 8px;
  filter:drop-shadow(0 8px 12px rgba(74,34,51,.2));
}
.ad-hero .nm{font-family:var(--font-disp);font-weight:800;font-size:15px;letter-spacing:.1em}
.ad-hero .cp{font-size:11px;opacity:.7;margin-top:3px}
.link-row{display:flex;gap:8px}
.link-row a{
  flex:1;text-align:center;text-decoration:none;color:#fff;background:var(--berry);
  border-radius:var(--r-md);padding:12px 6px;font-family:var(--font-disp);font-weight:800;font-size:12.5px;
}
.link-row a.ig{background:linear-gradient(135deg,#F9576F,#C13584)}
.link-row a.yt{background:#FF0033}

/* クローゼット */
.wear-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wear{
  position:relative;border:2px solid #FCE0E9;background:#FFF7FA;border-radius:var(--r-md);
  padding:10px 6px 8px;text-align:center;font:inherit;color:inherit;cursor:pointer;
  transition:transform .08s ease,border-color .12s ease;
}
.wear:active{transform:scale(.97)}
.wear.sel{border-color:var(--peach);background:#FFEDF3;box-shadow:0 0 0 2px rgba(255,94,134,.25)}
.wear.lock{opacity:.55;background:#F5F0F2;border-color:#EAE2E6}
.wear .sw{
  width:36px;height:36px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
  background:var(--c1,#FFC020);box-shadow:inset -10px -10px 0 var(--c2,#A09898),0 2px 0 rgba(74,34,51,.12);
  font-size:20px;
}
.wear .sw.accsw{background:#fff;box-shadow:0 2px 0 rgba(74,34,51,.12);border:2px solid #FCE0E9;padding:4px}
.wear .sw.accsw svg{width:100%;height:auto;display:block}
.wear .n{font-family:var(--font-disp);font-weight:800;font-size:11px;line-height:1.2}
.wear .c{font-size:9px;opacity:.6;margin-top:3px;line-height:1.3}
.wear .lk{position:absolute;top:5px;right:6px;font-size:11px}
.wear .chk{position:absolute;top:4px;right:5px;background:var(--peach);color:#fff;border-radius:99px;font-size:9px;font-weight:800;padding:1px 5px}

/* ダンス結果 */
.result{
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px;text-align:center;
  background:linear-gradient(160deg,#F0E6FF,#FFD9E8);
}
.result .rank{font-family:var(--font-disp);font-weight:800;font-size:56px;line-height:1;color:#8C5BD9;text-shadow:0 4px 0 rgba(140,91,217,.2)}
.result .rank.S{color:#FF5E86;text-shadow:0 4px 0 rgba(255,94,134,.25)}
.result .rank.A{color:#FFB13B}
.result .rank.C{color:#9A8AA8}
.result .st{display:flex;justify-content:center;gap:14px;margin-top:8px;font-size:11px;font-weight:700;opacity:.75}
.result .st b{font-family:var(--font-num);font-size:15px;display:block}
.gain{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.gain span{background:#FFF3F6;border:1.5px solid #FCE0E9;border-radius:999px;padding:4px 10px;font-family:var(--font-num);font-weight:800;font-size:11px}
.gain span.g{color:var(--mint-d);border-color:#BDEBDF} .gain span.b{color:var(--peach-d)}

/* トースト */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
  z-index:30;background:var(--berry);color:#fff;border-radius:999px;
  padding:9px 17px;font-family:var(--font-disp);font-weight:800;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.25s ease;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.gift{background:linear-gradient(90deg,#FF5E86,#FFB13B)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.05s!important}
}
</style>
</head>

   4. DOM
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
var bubble=$("bubble"), wrap=$("avatarWrap"), stage=$("stage"),
    sheet=$("sheet"), sheetInner=$("sheetInner"), toastEl=$("toast"),
    floatEl=$("avFloat"), growEl=$("avGrow"), bodyEl=$("body"), spriteEl=$("sprite"), accEl=$("acc"), eggEl=$("egg");
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ============================================================
   5. 演出（セリフ・キラキラ・トースト）
   ============================================================ */
var typeTimer=null;
function say(text){
  if(typeTimer){ clearInterval(typeTimer); }
  bubble.style.animation="none"; void bubble.offsetWidth; bubble.style.animation="";
  var i=0;
  bubble.textContent="";
  var cur=document.createElement("span"); cur.className="cursor"; bubble.appendChild(cur);
  typeTimer=setInterval(function(){
    i++;
    bubble.textContent=text.slice(0,i);
    bubble.appendChild(cur);
    if(i>=text.length){ clearInterval(typeTimer); typeTimer=null; setTimeout(function(){ if(cur.parentNode) cur.remove(); },600); }
  }, 34);
}
function sparkle(n, chars){
  chars = chars || ["✨","💕"];
  for(var k=0;k<n;k++){
    (function(k){
      setTimeout(function(){
        var el=document.createElement("div");
        el.className="spark"; el.textContent = pick(chars);
        el.style.left=(26+Math.random()*48)+"%";
        el.style.top=(38+Math.random()*22)+"%";
        el.style.setProperty("--dx",(Math.random()*40-20)+"px");
        el.style.setProperty("--dy",(-24-Math.random()*26)+"px");
        stage.appendChild(el);
        setTimeout(function(){ el.remove(); },1000);
      }, k*70);
    })(k);
  }
}
function fx(text,color,x,y){
  var el=document.createElement("div");
  el.className="fx"; el.textContent=text;
  el.style.color=color||"#FF5E86";
  el.style.left=(x!=null ? x : 38+Math.random()*44)+"%";
  el.style.top=(y!=null ? y : 52)+"%";
  stage.appendChild(el);
  setTimeout(function(){ el.remove(); },1100);
}
var toastTimer=null, toastQueue=[];
function toast(t, gift){
  toastQueue.push({t:t, g:!!gift});
  if(!toastTimer) nextToast();
}
function nextToast(){
  var it = toastQueue.shift();
  if(!it){ toastTimer=null; return; }
  toastEl.textContent=it.t; toastEl.className="toast on"+(it.g?" gift":"");
  toastTimer=setTimeout(function(){ toastEl.classList.remove("on"); setTimeout(nextToast, 260); }, it.g?2400:1600);
}
function flash(long){
  var f=$("flash");
  f.classList.remove("on","long"); void f.offsetWidth; if(long) f.classList.add("long"); f.classList.add("on");
}
$("flash").addEventListener("animationend", function(){ this.classList.remove("on","long"); });
$("evoRays").addEventListener("animationend", function(){ this.classList.remove("on"); });
function showTag(text, evo){
  var tag=$("shapeTag");
  tag.textContent=text;
  tag.className="shape-tag"+(evo?" evo":""); void tag.offsetWidth; tag.classList.add("on");
}

/* ============================================================
   6. ポーズ・アクション（スプライト）
   ============================================================ */
// スプライトシート上の位置（4列×3行）と、そのポーズでの頭の位置（アクセの取り付け座標）
var POSE = {jump:0, cheer:1, dance:2, clap:3, kiss:4, thanks:5, yay:6, hmm:7, run:8, sorry:9, win:10, sleep:11};
var HEAD = [[50,18],[42,11],[44,13],[42,19],[32,26],[46,28],[44,14],[53,9],[38,23],[49,24],[44,17],[45,2]];
function setPose(name){
  var i = POSE[name]; if(i == null || !spriteEl) return;
  spriteEl.style.backgroundPosition = ((i%4)*(100/3)).toFixed(3)+"% "+(Math.floor(i/4)*50)+"%";
  spriteEl.setAttribute("data-pose", name);
  accEl.style.setProperty("--hx", HEAD[i][0]+"%");
  accEl.style.setProperty("--hy", HEAD[i][1]+"%");
}
// 何もしていないときに表示するポーズ（状態で変わる）
function idlePose(){
  var h = new Date().getHours();
  if(S.energy < 20 || h < 5) return "sleep";
  if(S.mood < 30) return "sorry";
  if(S.shape === "toomuch") return "hmm";
  if(S.shape === "chubby") return "thanks";
  return S.mood > 70 ? "cheer" : "thanks";
}

// コマの並び／1コマの長さ／繰り返し回数／体の動き
var ACT = {
  dance:{f:["dance","cheer","dance","yay"], ms:170, n:3, css:"act-dance", spark:8},
  cheer:{f:["cheer","yay"],  ms:175, n:4, css:"act-cheer", spark:4},
  jump: {f:["jump","cheer"], ms:220, n:2, css:"act-jump",  spark:4},
  run:  {f:["run","jump"],   ms:120, n:6, css:"act-run"},
  clap: {f:["clap","cheer"], ms:150, n:5, css:"act-cheer", spark:3},
  win:  {f:["win","yay"],    ms:180, n:4, css:"act-win",   spark:9},
  kiss: {f:["kiss","thanks"],ms:350, n:2, css:"act-kiss",  spark:5},
  tilt: {f:["hmm","thanks"], ms:520, n:2, css:"act-tilt"},
  shy:  {f:["sorry","hmm"],  ms:430, n:2, css:"act-shy"},
  nap:  {f:["sleep"],        ms:900, n:1}
};
var ACTS = ["dance","cheer","jump","run","clap","win","kiss","tilt","dance"];
var seqTimer = null, actTimer = null, dancing = false;

var curAct="cheer";
function playAct(name){
  var a = ACT[name]; if(!a || !spriteEl || dancing) return;
  curAct = name;
  if(seqTimer){ clearInterval(seqTimer); seqTimer=null; }
  if(actTimer){ clearTimeout(actTimer); actTimer=null; }
  for(var k in ACT){ if(ACT[k].css) floatEl.classList.remove(ACT[k].css); }
  if(REDUCED){ setPose(a.f[0]); return; }   // 動きを減らす設定なら1枚出すだけ
  void floatEl.offsetWidth;                 // 体の動きを頭から再生させる
  if(a.css) floatEl.classList.add(a.css);
  var step = 0, total = a.f.length * a.n;
  setPose(a.f[0]);
  seqTimer = setInterval(function(){
    step++;
    if(step >= total){ clearInterval(seqTimer); seqTimer = null; return; }
    setPose(a.f[step % a.f.length]);
  }, a.ms);
  if(a.spark) sparkle(a.spark);
  actTimer = setTimeout(function(){
    if(a.css) floatEl.classList.remove(a.css);
    actTimer = null; setPose(idlePose());
  }, total * a.ms);
}
function react(kind){
  if(kind === "shock") playAct("shy");
  else playAct(pick(["jump","cheer","dance"]));
}
// 放っておいても4〜8秒ごとに勝手に動く。体型で動きのクセが変わる
var idleTimer = null;
function idleLoop(){
  if(REDUCED) return;
  idleTimer = setTimeout(function(){
    if(!document.hidden && !sheet.classList.contains("on") && !actTimer && !dancing && S.stage > 0){
      var w = S.energy < 20 ? ["nap","tilt"]
            : S.mood < 35   ? ["tilt","shy","tilt"]
            : S.shape === "chubby" ? ["tilt","shy","nap","cheer","tilt"]
            : S.shape === "fit"    ? ["dance","jump","win","run","cheer"]
            : S.mood > 80   ? ["dance","jump","win","cheer","dance"]
            : ACTS;
      if(S.mess.length >= 3 && Math.random() < 0.4) w = ["tilt","shy","tilt"];
      playAct(pick(w));
      if(S.beauty >= 75 && Math.random() < 0.5) sparkle(3, ["✨","⭐","✨"]);
    }
    idleLoop();
  }, 4000 + Math.random()*4000);
}

   7. 見た目（体型・大きさ・きれい・服・アクセ）
   ============================================================ */
var SHAPE_NAME={chubby:"ぷにぷに期",soft:"ふっくら期",natural:"ナチュラル",fit:"しゅっと期",toomuch:"がんばりすぎ"};
function shapeOf(p){
  if(p>=80) return "chubby";
  if(p>=65) return "soft";
  if(p>=35) return "natural";
  if(p>=20) return "fit";
  return "toomuch";
}
function applyShape(announce){
  var next=shapeOf(S.puni);
  var changed = next !== S.shape;
  S.shape=next;
  wrap.setAttribute("data-shape",next);
  if(changed && announce){
    flash(false); showTag(SHAPE_NAME[next], false);
    setTimeout(function(){ say(LINES.shape[next]); }, 900);
  }
  return changed;
}
// 状態 → 拡大率。太ると横に広がって少し縮み、痩せると細く背が伸びる
function applyLook(){
  var fat = (S.puni - 50) / 50;                       // -1..1
  var sc = (STAGES[S.stage] || STAGES[1]).scale;
  var gx = fat >= 0 ? sc*(1 + 0.36*fat) : sc*(1 - 0.14*(-fat));
  var gy = fat >= 0 ? sc*(1 - 0.08*fat) : sc*(1 + 0.05*(-fat));
  growEl.style.setProperty("--gx", gx.toFixed(3));
  growEl.style.setProperty("--gy", gy.toFixed(3));
  wrap.setAttribute("data-beauty", S.beauty >= 75 ? "high" : S.beauty <= 30 ? "low" : "mid");
  stage.setAttribute("data-mess", String(S.mess.length));
  var h = new Date().getHours();
  stage.classList.toggle("night", h >= 19 || h < 5);
  wrap.classList.toggle("egg-mode", S.stage === 0);
  eggEl.classList.toggle("on", S.stage === 0);
  eggEl.setAttribute("data-crack", String(Math.min(3, Math.floor(S.eggTaps/2))));
  // アクセ
  var acc = accById(S.acc);
  if(acc && acc.svg){
    if(accEl.getAttribute("data-id") !== acc.id){ accEl.innerHTML = acc.svg; accEl.setAttribute("data-id", acc.id); }
    accEl.style.setProperty("--aw", acc.aw); accEl.style.setProperty("--ax", acc.ax); accEl.style.setProperty("--ay", acc.ay);
  }else{ accEl.innerHTML=""; accEl.removeAttribute("data-id"); }
  $("closetNew").classList.toggle("on", !!S.closetNew);
}
function accById(id){ for(var i=0;i<ACCS.length;i++) if(ACCS[i].id===id) return ACCS[i]; return ACCS[0]; }
function outfitById(id){ for(var i=0;i<OUTFITS.length;i++) if(OUTFITS[i].id===id) return OUTFITS[i]; return OUTFITS[0]; }

function hsl(r,g,b){
  r/=255;g/=255;b/=255;

function loadBase(cb){
  if(baseData){ cb(); return; }
  if(!baseImg){
    baseImg = new Image();
    baseImg.onload = function(){
      try{
        var c=document.createElement("canvas"); c.width=baseImg.naturalWidth; c.height=baseImg.naturalHeight;
        var g=c.getContext("2d"); g.drawImage(baseImg,0,0);
        baseData = g.getImageData(0,0,c.width,c.height);
      }catch(e){ baseData=null; }
      cb();
    };

  }else{ setTimeout(function(){ loadBase(cb); }, 60); }
}
function buildOutfit(id, cb){
  if(spriteCache[id]){ cb(spriteCache[id]); return; }
  var o = outfitById(id);
  loadBase(function(){
    if(!baseData || !o.shirt){ cb(SPRITE_SRC); return; }
    try{
      var c=document.createElement("canvas"); c.width=baseData.width; c.height=baseData.height;
      var g=c.getContext("2d");
      var id2=g.createImageData(baseData.width, baseData.height), s=baseData.data, d=id2.data;
      d.set(s);
      var SH=o.shirt, SO=o.shorts;
      for(var i=0;i<d.length;i+=4){
        if(d[i+3]<40) continue;
        var c3=hsl(d[i],d[i+1],d[i+2]), h=c3[0], sa=c3[1], l=c3[2], t=null, base=0;
        if(h>=38&&h<=56&&sa>.55&&l>.25&&l<.7){ t=SH; base=.55; }       // 黄色いシャツ
        else if(sa<.12&&l>.28&&l<.72){ t=SO; base=.6; }                // グレーの短パン
        if(t){ var n=rgb(t[0],t[1],Math.min(.96,l*t[2]/base)); d[i]=n[0]; d[i+1]=n[1]; d[i+2]=n[2]; }

function applyOutfit(){

}

function checkUnlocks(){
  var got=[];
  OUTFITS.concat(ACCS).forEach(function(it){
    if(!S.unlocked[it.id] && it.test && it.test()){ S.unlocked[it.id]=1; got.push(it); }
  });
  if(got.length){
    S.closetNew=true;
    got.forEach(function(it,i){ toast("🎁 「"+it.name+"」をゲット！", true); });
    setTimeout(function(){ sparkle(6, ["🎁","✨","💝"]); }, 300);
    applyLook();
  }
  return got;
}

  var t = todayKey();

  checkEvolve();
}
function checkEvolve(){
  if(S.stage === 0) return false;
  var next = stageFor(S.careDays);

  var from = S.stage;
  S.stage = next;
  playEvolve(from, next);
  return true;
}
function playEvolve(from, to){
  var st = STAGES[to];
  say("……あれ？なんか体が……光ってる……！？");
  playAct("shy");
  setTimeout(function(){
    var r=$("evoRays"); r.classList.remove("on"); void r.offsetWidth; r.classList.add("on");
    flash(true); sparkle(14, ["✨","⭐","🌟"]);
    setTimeout(function(){
      showTag("しんか！ "+st.name, true);
      render(); playAct("win");
      setTimeout(function(){ say(LINES.evolve[to] || "進化した！"); checkUnlocks(); save(); }, 1300);
    }, 500);
  }, 1500);
}
function tapEgg(){

  for(var k=0;k<n && S.mess.length<MESS_MAX;k++){
    var side = Math.random()<0.5 ? -1 : 1;
    var x = side<0 ? 8+Math.random()*18 : 66+Math.random()*20;
    S.mess.push({t: typeIdx!=null ? typeIdx : Math.floor(Math.random()*MESS_TYPES.length), x:Math.round(x), y:Math.round(3+Math.random()*12), r:Math.round(Math.random()*40-20)});
    added++;

}

/* ============================================================
   10. 経過時間による変化＋日付処理
   ============================================================ */
function applyElapsed(hours){
  if(hours <= 0) return;
  var messN = S.mess.length;
  S.beauty = clamp(S.beauty - hours*(0.8 + messN*0.6), 0, 100);
  S.mood   = clamp(S.mood - hours*(0.5 + messN*0.5), 0, 100);
  S.puni   = clamp(S.puni + hours*0.4, 0, 100);
  S.energy = clamp(S.energy + hours*2.2, 0, 100);
}
function tickMess(){
  if(S.stage===0) return 0;
  var now=Date.now(), n=0;
  if(!S.messAt) S.messAt=now;
  while(now - S.messAt >= MESS_EVERY_MS && S.mess.length < MESS_MAX){ S.messAt += MESS_EVERY_MS; n+=spawnMess(1); }
  if(S.mess.length >= MESS_MAX) S.messAt = now;
  return n;
}
function tickOffline(){
  var now=Date.now();
  var hours=(now-(S.lastTs||now))/3600000;
  var msg="";
  if(hours>=4){
    applyElapsed(Math.min(hours, 30));
    msg=LINES.comeback(hours);
  }else{
    applyElapsed(hours);
  }
  tickMess();
  var t=todayKey();
  if(S.lastDay!==t){
    if(S.lastDay){
      var y=new Date(); y.setDate(y.getDate()-1);
      var ykey=todayKey(y);
      S.streak = (S.lastDay===ykey && (S.mealCount>0||S.moveCount>0||S.danceCount>0)) ? S.streak+1 : (S.lastDay===ykey ? S.streak : 0);
    }
    S.mealCount=0; S.moveCount=0; S.danceCount=0; S.lookRepeat=0; S.lastDay=t;
  }
  S.visits++;
  if(!msg && S.mess.length >= 4) msg = pick(LINES.mess.many);
  else if(!msg && S.mess.length >= 2) msg = pick(LINES.mess.some);
  return msg;
}

var recentLines = [];
function noRepeat(pool){

// 時間帯・キゲン・たいりょく・体型・きれい・部屋・連続日数から、その瞬間に合うセリフを選ぶ
function lookLine(){
  var L = LINES.look, h = new Date().getHours(), ctx = [];
  if(h < 5)       ctx = ctx.concat(L.midnight);
  else if(h < 11) ctx = ctx.concat(L.morning);
  else if(h < 15) ctx = ctx.concat(L.noon);
  else if(h < 19) ctx = ctx.concat(L.evening);
  else            ctx = ctx.concat(L.night);
  if(S.mood < 35)   ctx = ctx.concat(L.moodLow);
  if(S.mood > 85)   ctx = ctx.concat(L.moodHigh);
  if(S.energy < 25) ctx = ctx.concat(L.tired);
  if(S.beauty >= 75) ctx = ctx.concat(L.beautyHigh);
  if(S.beauty <= 30) ctx = ctx.concat(L.beautyLow);
  if(S.mess.length >= 3) ctx = ctx.concat(LINES.mess.many);
  else if(S.mess.length >= 1) ctx = ctx.concat(LINES.mess.some);
  if(S.weight == null) ctx = ctx.concat(L.noWeight);
  if(S.streak >= 3) ctx = ctx.concat(L.streak.map(function(t){ return t.replace("{n}", S.streak); }));
  if(S.shape === "chubby" || S.shape === "toomuch") ctx.push(LINES.shape[S.shape]);
  // 6割は今の状況に刺さるセリフ、4割は汎用からランダム
  return noRepeat((Math.random() < 0.6 && ctx.length) ? ctx : L.any);
}

  else { playAct(pick(["dance","cheer","clap","jump","win","kiss","tilt"])); say(lookLine()); }

}

var AC=null;
function audio(){
  if(S.mute) return null;
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==="suspended"){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(freq, dur, type, gain, when, slide){
  var ac=audio(); if(!ac) return;
  try{
    var o=ac.createOscillator(), g=ac.createGain(); var t=when!=null?when:ac.currentTime;
    o.type=type||"triangle"; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||.15,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
function sfxKick(when){ tone(150,.14,"sine",.5,when,50); }
function sfxHat(when){ tone(6400,.04,"square",.025,when); }
function sfxHit(combo, perfect){
  var f = 520 + Math.min(700, combo*18);
  tone(f,.12,"triangle",.22); if(perfect) tone(f*1.5,.16,"sine",.14, null);
}
function sfxMiss(){ tone(140,.2,"sawtooth",.12,null,80); }
function sfxFanfare(){
  var ac=audio(); if(!ac) return; var t=ac.currentTime;
  [523,659,784,1047].forEach(function(f,i){ tone(f,.22,"triangle",.2,t+i*.11); });
}

var D = null;   // 進行中のダンス

var BPM = 112, BEAT = 60/BPM, TRAVEL = 1.55;   // 1拍の秒数／♪が右端から わ まで飛ぶ秒数

    optHTML("danceStart","🎵","踊る！（約20秒）","ベスト："+(S.danceBest? S.danceBest+"点 "+S.danceBestRank+"ランク" : "まだなし"))+
    '<button class="close" data-act="close">やめとく</button>'

function makeChart(){
  // 8小節。前半は4分音符、後半に8分が混ざる（合計28個）
  var t=[], b=0, bar;
  for(bar=0;bar<8;bar++){
    for(var q=0;q<4;q++){
      var at = bar*4+q;
      t.push(at);
      if(bar>=3 && (q===1 || (bar>=6 && q===3))) t.push(at+0.5);
    }
  }
  return t.map(function(x){ return x*BEAT; });
}
function startDance(){

  D = { t0:null, notes:chart.map(function(t,i){ return {t:t, el:null, done:false, cls: i%2?"b":""}; }),
        score:0, combo:0, maxCombo:0, perfect:0, good:0, miss:0, lastBeat:-1, end:chart[chart.length-1]+1.0, poseI:0 };
  $("dScore").textContent="0"; $("dCombo").textContent="0"; $("dProg").style.width="0%";
  $("tapHint").style.display="";
  var ac=audio();
  D.ac0 = ac ? ac.currentTime : 0;
  // 拍のクリックをまとめて予約（音は先にスケジュールした方がズレない）

    for(var i=0;i<totalBeats;i++){ var w=D.ac0+i*BEAT; if(i%2===0) sfxKick(w); else sfxHat(w); }

}
var DANCE_POSES=["dance","cheer","yay","clap","dance","jump","win","cheer"];
function danceFrame(){
  if(!D) return;
  var now=(performance.now()-D.t0)/1000;
  var laneW = laneEl.clientWidth, ringX = laneW*0.22;
  var beat = Math.floor(now/BEAT);
  if(beat !== D.lastBeat){
    D.lastBeat = beat;
    if(beat < 4){
      var c=document.createElement("div"); c.className="count"; c.textContent = beat<3 ? String(3-beat) : "GO!";
      danceEl.appendChild(c); setTimeout(function(){ c.remove(); }, 900);
      if(beat===3) floatEl.classList.add("dancing");
    }
    setPose(DANCE_POSES[beat % DANCE_POSES.length]);
    if(beat>=4 && beat%2===0 && S.beauty>=60) sparkle(1,["✨"]);
  }
  D.notes.forEach(function(n){
    if(n.done) return;
    var dt = n.t - now;
    if(dt < TRAVEL && !n.el){
      var el=document.createElement("div"); el.className="note "+n.cls; el.textContent = n.cls ? "♫" : "♪";
      laneEl.appendChild(el); n.el=el;
    }
    if(n.el){
      var x = ringX + dt/TRAVEL*(laneW-ringX);
      n.el.style.transform="translateX("+x+"px)"; n.el.style.setProperty("--x", x+"px");
    }
    if(dt < -0.18){ judge(n, "miss"); }
  });
  $("dProg").style.width = clamp((now-BEAT*4)/(D.end-BEAT*4)*100,0,100)+"%";
  if(now >= D.end){ endDance(); return; }
  requestAnimationFrame(danceFrame);
}
function judge(n, kind){
  n.done=true;
  if(n.el){ n.el.classList.add(kind==="miss"?"miss":"hit"); (function(el){ setTimeout(function(){ el.remove(); },400); })(n.el); }
  var j=document.createElement("div"); j.className="judge "+kind;
  if(kind==="perfect"){ D.perfect++; D.combo++; D.score+=100+Math.min(100,D.combo*5); j.textContent="PERFECT!"; sfxHit(D.combo,true); sparkle(2,["✨","💖"]); }
  else if(kind==="good"){ D.good++; D.combo++; D.score+=60+Math.min(60,D.combo*3); j.textContent="GOOD"; sfxHit(D.combo,false); }
  else { D.miss++; D.combo=0; j.textContent="miss…"; sfxMiss(); }
  if(D.combo>D.maxCombo) D.maxCombo=D.combo;
  if(kind!=="miss"){ ringEl.classList.remove("hit"); void ringEl.offsetWidth; ringEl.classList.add("hit"); $("tapHint").style.display="none"; }
  danceEl.appendChild(j); setTimeout(function(){ j.remove(); },560);

  $("dCombo").textContent=D.combo;
  var cw=$("dComboWrap"); cw.classList.remove("hot"); void cw.offsetWidth; if(D.combo>=5) cw.classList.add("hot");
}
function danceTap(e){
  if(!D) return;

  var now=(performance.now()-D.t0)/1000, best=null, bd=1;

}
function endDance(aborted){
  var r = D; D=null; dancing=false;
  danceEl.classList.remove("on"); danceEl.setAttribute("aria-hidden","true");
  stage.classList.remove("disco");
  floatEl.classList.remove("dancing");
  laneEl.querySelectorAll(".note").forEach(function(n){ n.remove(); });
  danceEl.querySelectorAll(".count,.judge").forEach(function(n){ n.remove(); });
  setPose(idlePose());
  if(aborted || !r){ say("あれ、途中でやめちゃった？\nまた踊ろうね！"); render(); return; }
  var total=r.notes.length, acc=(r.perfect*1+r.good*0.6)/total;
  var rank = acc>=0.95 ? "S" : acc>=0.8 ? "A" : acc>=0.55 ? "B" : "C";
  var dPuni = -(3 + Math.round(6*acc)), dBeauty = 4 + Math.round(9*acc), dMood = 6 + Math.round(10*acc), dEnergy = -22;
  var before=S.shape;
  S.puni=clamp(S.puni+dPuni,0,100); S.beauty=clamp(S.beauty+dBeauty,0,100); S.mood=clamp(S.mood+dMood,0,100); S.energy=clamp(S.energy+dEnergy,0,100);
  S.danceCount++; S.danceTotal++;
  if(r.score > S.danceBest){ S.danceBest=r.score; }
  var RANKV={S:4,A:3,B:2,C:1};
  if(!S.danceBestRank || RANKV[rank] > RANKV[S.danceBestRank]) S.danceBestRank = rank;
  if(rank==="S"||rank==="A"){ sfxFanfare(); playAct("win"); } else playAct("cheer");
  stampUp(); markCare();
  say(pick(LINES.dance[rank]));
  openSheet(
    '<div class="result"><div class="rank '+rank+'">'+rank+'</div>'+
    '<div class="st"><span>SCORE<b>'+r.score+'</b></span><span>PERFECT<b>'+r.perfect+'</b></span><span>GOOD<b>'+r.good+'</b></span><span>MISS<b>'+r.miss+'</b></span><span>MAX COMBO<b>'+r.maxCombo+'</b></span></div></div>'+
    '<div class="gain"><span class="g">ぷに '+dPuni+'</span><span class="g">きれい +'+dBeauty+'</span><span class="g">キゲン +'+dMood+'</span><span class="b">たいりょく '+dEnergy+'</span></div>'+
    '<button class="primary grape" data-act="close">おつかれ！</button>'
  );
  finish(before);
}

$("dMute").addEventListener("click", function(e){

    }
  }
});

/* クリック委譲 */
sheetInner.addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  var a=b.getAttribute("data-act");
  if(a==="close"){ closeSheet(); return; }
  if(a==="danceStart"){ startDance(); return; }
  if(a==="wearOutfit"){
    var id=b.getAttribute("data-id"); if(!S.unlocked[id]) return;
    S.outfit=id; applyOutfit(); sheetCloset(); playAct("win"); say(pick(LINES.wear)); fx("きせかえ！","#8C5BD9"); save(); return;
  }
  if(a==="wearAcc"){
    var id2=b.getAttribute("data-id"); if(!S.unlocked[id2]) return;
    S.acc=id2; applyLook(); sheetCloset(); playAct("kiss"); say(pick(LINES.wear)); save(); return;
  }
  if(a==="saveWeight"){
    var v=parseFloat(document.getElementById("wtInput").value);
    if(isNaN(v)||v<20||v>200){ toast("20〜200の数字を入れてね"); return; }
    if(S.weight!=null) S.prevWeight=S.weight;
    S.weight=Math.round(v*10)/10;
    if(S.weightStart==null) S.weightStart=S.weight;
    closeSheet(); render(); save();
    var d=(S.prevWeight!=null)?+(S.weight-S.prevWeight).toFixed(1):0;
    playAct(d<0 ? "win" : d>0 ? "tilt" : "cheer");
    if(S.prevWeight==null) say("記録スタート！\n数字は増えたり減ったりして当たり前。\n折れ線が下向けば勝ちだからね！");
    else if(d<0){ fx(d.toFixed(1)+"kg","#2FBFA0"); say("減ってる！！すごい！\nでも一喜一憂しないのがプロだよ〜"); }
    else if(d>0){ say("増えた？大丈夫大丈夫。\n水分と食事のタイミングで1kgは平気で動くから！"); }
    else say("キープ！\n維持できてる人って、実は一番強いんだよ");
    return;
  }
  if(["healthy","normal","reward"].indexOf(a)>=0){ doMeal(a); return; }
  if(["light","solid","hard"].indexOf(a)>=0){ doMove(a); return; }
});
// 部屋の中：散らかりものをタップで片付け
stage.addEventListener("click", function(e){
  var m=e.target.closest(".mess"); if(m && !dancing){ cleanMess(m); }
});


/* ============================================================
   16. 起動
   ============================================================ */
$("btnMeal").addEventListener("click", sheetMeal);
$("btnMove").addEventListener("click", sheetMove);
$("btnDance").addEventListener("click", sheetDance);
$("btnLook").addEventListener("click", doLook);
$("weightBtn").addEventListener("click", sheetWeight);
$("jarBtn").addEventListener("click", showChenMe);
$("closetBtn").addEventListener("click", sheetCloset);
$("avatarWrap").addEventListener("click", function(e){ if(e.target.closest(".egg")) tapEgg(); else pokeNaru(); });

var backMsg=tickOffline();
render();
renderMess();
setButtons();
applyOutfit();
save();
setPose(idlePose());
if(S.stage===0){
  setTimeout(function(){ say(LINES.egg[0]); }, 300);
}else{
  var evolved = checkEvolve();
  if(!evolved) setTimeout(function(){ say(backMsg || pick(LINES.welcome)); react("happy"); }, 300);
}
idleLoop();

// 開きっぱなし対策：1分ごとに、前回保存からの経過ぶんだけ少し動く
setInterval(function(){
  if(dancing) return;
  var hours=(Date.now()-(S.lastTs||Date.now()))/3600000;
  applyElapsed(hours);
  if(tickMess()){ renderMess(); if(!sheet.classList.contains("on")) say(pick(LINES.mess.some)); }
  render(); save();
}, 60000);

// デバッグ用（テスト実行時に状態を確認するため）
window.__naru={ get:function(){ return S; }, set:function(o){ Object.assign(S,o); render(); renderMess(); setButtons(); save(); },
  meal:doMeal, move:doMove, look:doLook, poke:pokeNaru, line:lookLine, lines:LINES, act:playAct, pose:setPose, idlePose:idlePose,
  sprite:function(){return spriteEl.getAttribute("data-pose");}, render:render, mess:function(n){ spawnMess(n||1); renderMess(); save(); },
  clean:cleanMess, evolve:function(){ S.careDays=STAGES[Math.min(4,S.stage+1)].days; return checkEvolve(); }, hatch:hatch, egg:tapEgg,
  dance:startDance, endDance:endDance, danceState:function(){ return D; }, closet:sheetCloset, wear:function(o,a){ if(o) S.outfit=o; if(a) S.acc=a; applyOutfit(); render(); save(); },
  unlockAll:function(){ OUTFITS.concat(ACCS).forEach(function(i){ S.unlocked[i.id]=1; }); save(); }, unlocks:checkUnlocks, outfits:OUTFITS, accs:ACCS, stages:STAGES, cache:spriteCache };

})();
